
{% extends "base.html" %}

{% block title %}Login | CorrelationLab{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <section class="auth-card">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Sign in</h1>
        <p>Access your data analysis workspace.</p>

        <form method="POST" class="auth-form">
            <label for="username">Username</label>
            <input id="username" name="username" type="text"
                   minlength="3" maxlength="30" autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>

            <button class="btn btn-primary btn-full" type="submit">Login</button>
        </form>

        <p class="auth-switch">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create one</a>
        </p>
    </section>
</div>
{% endblock %}
